# Generated by OpenSpec for GitHub Copilot coding agent support.

name: "Copilot Setup Steps"

# Run manually to verify the setup; Copilot runs these steps when starting agent work.
on:
  workflow_dispatch:

jobs:
  # The job MUST be called `copilot-setup-steps` for Copilot coding agent to pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.14.1

      - name: Verify OpenSpec CLI
        run: openspec --version